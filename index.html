<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>هدية خاصة لكِ 🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #050102;
      --bg-1: #180309;
      --crimson: #e11d48;
      --rose-light: #fda4af;
      --gold: #f5cb7f;
      --glass: rgba(24, 5, 11, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, var(--bg-1) 0%, var(--bg-0) 100%);
      font-family: 'Cairo', sans-serif;
      color: #fff;
      user-select: none;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* شاشة البداية قبل فتح الهدية */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 42%, rgba(42, 6, 17, 0.94) 0%, rgba(5, 1, 2, 0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.06);
      pointer-events: none;
    }

    .seal-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid rgba(245, 203, 127, 0.85);
      background: radial-gradient(circle at 32% 28%, #fb7185 0%, #be123c 58%, #5c061b 100%);
      box-shadow:
        0 0 0 8px rgba(225, 29, 72, 0.14),
        0 18px 40px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(225, 29, 72, 0.45);
      color: #fff;
      font-size: 2.3rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      margin-bottom: 22px;
      animation: sealFloat 2.6s ease-in-out infinite;
      transition: transform 0.2s ease;
    }

    .seal-btn:active {
      transform: scale(0.92);
    }

    @keyframes sealFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.04); }
    }

    .intro-title {
      font-family: 'Amiri', serif;
      font-size: 1.85rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .intro-sub {
      font-size: 0.92rem;
      color: rgba(255, 232, 237, 0.78);
      max-width: 300px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .start-cta {
      background: linear-gradient(135deg, #be123c, #e11d48 55%, #f43f5e);
      color: #fff;
      border: 1px solid rgba(245, 203, 127, 0.65);
      padding: 12px 28px;
      border-radius: 999px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(225, 29, 72, 0.42);
    }

    /* واجهة العرض بعد فتح الهدية */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      opacity: 0;
      transition: opacity 0.8s ease 0.25s;
    }

    .ui-layer.active {
      opacity: 1;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--glass);
      border: 1px solid rgba(245, 203, 127, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: #ffe4ea;
    }

    .mini-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(245, 203, 127, 0.35);
      color: var(--gold);
      border-radius: 999px;
      padding: 6px 13px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* كرت الرسالة السفلي الشفاف الأنيق */
    .message-panel {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: linear-gradient(170deg, rgba(36, 7, 16, 0.82) 0%, rgba(12, 2, 6, 0.9) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 203, 127, 0.42);
      border-radius: 24px;
      padding: 18px 18px 15px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      text-align: center;
    }

    .panel-tag {
      font-size: 0.75rem;
      color: var(--gold);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .typed-message {
      font-family: 'Amiri', serif;
      font-size: 1.28rem;
      line-height: 1.8;
      color: #fff5f7;
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background: var(--gold);
      margin-right: 3px;
      vertical-align: middle;
      animation: blink 0.85s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .panel-footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.76rem;
      color: rgba(255, 228, 234, 0.78);
    }

    .replay-btn {
      background: linear-gradient(135deg, #be123c, #e11d48);
      color: #fff;
      border: 1px solid rgba(245, 203, 127, 0.45);
      border-radius: 999px;
      padding: 5px 13px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- شاشة الدخول التفاعلية -->
  <div class="intro-overlay" id="introOverlay">
    <button class="seal-btn" id="sealBtn" type="button" aria-label="افتحي الهدية">🌹</button>
    <h1 class="intro-title">لأميرتي و شريكة عمري</h1>
    <p class="intro-sub">معمولة بكل حب بس من بعيد...  حبيبتي كبسي تحت</p>
    <button class="start-cta" id="startBtn" type="button">هون يعمري</button>
  </div>

  <!-- الواجهة الرئيسية بعد الفتح -->
  <div class="ui-layer" id="uiLayer">
    <div class="top-row">
      <div class="badge">بحبككككك بيبيتي</div>
      <button class="mini-btn" id="reopenIntroBtn" type="button">🔒</button>
    </div>

    <div class="message-panel">
      <div class="panel-tag">حبيبتي و شريكة حياتي </div>
      <div class="typed-message">
        <span id="typedText"></span><span class="cursor" id="cursor"></span>
      </div>
      <div class="panel-footer">
        <span>حرّكي إصبعك أو أميلي الموبايل</span>
        <button class="replay-btn" id="replayBtn" type="button">إعادة الرسالة</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const introOverlay = document.getElementById('introOverlay');
    const sealBtn = document.getElementById('sealBtn');
    const startBtn = document.getElementById('startBtn');
    const reopenIntroBtn = document.getElementById('reopenIntroBtn');
    const uiLayer = document.getElementById('uiLayer');
    const typedTextEl = document.getElementById('typedText');
    const cursorEl = document.getElementById('cursor');
    const replayBtn = document.getElementById('replayBtn');

    const fullMessage =
      ' انا قلتلك الك مني ورد بس بطريقة تانية مو اي حدا بيعرف يعملا و حبيبك مهندس برمجيات حب يعملك هالبوكيه لأنو بعيد عنك';

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // حركة العمق (Parallax) باللمس أو إمالة الموبايل
    let targetTiltX = 0;
    let targetTiltY = 0;
    let tiltX = 0;
    let tiltY = 0;
    let opened = false;
    let openAnim = 0; // 0 -> 1 عند الفتح

    function setTiltFromNorm(nx, ny) {
      targetTiltX = Math.max(-1, Math.min(1, nx));
      targetTiltY = Math.max(-1, Math.min(1, ny));
    }

    window.addEventListener('pointermove', (e) => {
      if (!width || !height) return;
      setTiltFromNorm((e.clientX / width - 0.5) * 2, (e.clientY / height - 0.5) * 2);
    });

    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma == null || e.beta == null) return;
      setTiltFromNorm(e.gamma / 25, (e.beta - 45) / 25);
    });

    // جسيمات ذهبية وبتلات
    const particles = [];

    function spawnBurst(cx, cy, count = 32) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const speed = Math.random() * 5.2 + 1.6;
        const isGold = Math.random() < 0.32;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.12,
          size: isGold ? Math.random() * 3 + 2 : Math.random() * 9 + 7,
          isGold,
          life: 0,
          maxLife: Math.random() * 65 + 75,
          alpha: 1
        });
      }
    }

    function spawnAmbientPetal() {
      particles.push({
        x: Math.random() * width,
        y: -18,
        vx: (Math.random() - 0.5) * 0.9,
        vy: Math.random() * 1.1 + 0.65,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.04,
        size: Math.random() * 7 + 6,
        isGold: Math.random() < 0.18,
        life: 0,
        maxLife: 340,
        alpha: 0.85
      });
    }

    // كتابة الرسالة حرفاً بحرف
    let typingTimer = null;
    function startTypewriter() {
      clearInterval(typingTimer);
      typedTextEl.textContent = '';
      cursorEl.style.display = 'inline-block';
      let idx = 0;

      typingTimer = setInterval(() => {
        typedTextEl.textContent += fullMessage[idx];
        idx++;
        if (idx >= fullMessage.length) {
          clearInterval(typingTimer);
          setTimeout(() => {
            cursorEl.style.display = 'none';
          }, 1800);
        }
      }, 36);
    }

    function openGift() {
      if (opened) {
        spawnBurst(width * 0.5, height * 0.36, 24);
        return;
      }
      opened = true;
      introOverlay.classList.add('hidden');
      uiLayer.classList.add('active');
      spawnBurst(width * 0.5, height * 0.36, 48);
      setTimeout(startTypewriter, 500);
    }

    sealBtn.addEventListener('click', openGift);
    startBtn.addEventListener('click', openGift);
    replayBtn.addEventListener('click', () => {
      startTypewriter();
      spawnBurst(width * 0.5, height * 0.36, 22);
    });

    reopenIntroBtn.addEventListener('click', () => {
      opened = false;
      openAnim = 0;
      uiLayer.classList.remove('active');
      introOverlay.classList.remove('hidden');
      clearInterval(typingTimer);
      typedTextEl.textContent = '';
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (!opened) return;
      spawnBurst(e.clientX, e.clientY, 18);
    });

    // ترتيب وردات الجوري بعمق مختلف (depth من 0.65 للخلف إلى 1.15 للأمام)
    const roses = [
      { ox: 0,     oy: -0.08, r: 42, depth: 0.72, rot: -0.1 },
      { ox: -0.15, oy: -0.04, r: 40, depth: 0.80, rot: -0.25 },
      { ox: 0.15,  oy: -0.04, r: 40, depth: 0.80, rot: 0.25 },
      { ox: -0.08, oy: 0.02,  r: 45, depth: 0.92, rot: -0.12 },
      { ox: 0.08,  oy: 0.02,  r: 45, depth: 0.92, rot: 0.12 },
      { ox: -0.22, oy: 0.04,  r: 38, depth: 0.86, rot: -0.32 },
      { ox: 0.22,  oy: 0.04,  r: 38, depth: 0.86, rot: 0.32 },
      { ox: 0,     oy: 0.08,  r: 47, depth: 1.05, rot: 0.04 }
    ];

    function drawPetal(cx, cy, r, angle, layerT, warmShift) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      const len = r * (0.48 + layerT * 0.56);
      const wid = r * (0.34 + layerT * 0.35);

      const grad = ctx.createRadialGradient(0, -len * 0.28, wid * 0.12, 0, len * 0.05, len * 1.05);
      grad.addColorStop(0, layerT > 0.72 ? '#ff7593' : '#ff2e5a');
      grad.addColorStop(0.55, layerT > 0.45 ? '#c70631' : '#960322');
      grad.addColorStop(1, '#38000c');

      ctx.beginPath();
      ctx.moveTo(0, wid * 0.22);
      ctx.bezierCurveTo(-wid * 1.18, wid * 0.08, -wid * 1.05, -len * 0.88, 0, -len);
      ctx.bezierCurveTo(wid * 1.05, -len * 0.88, wid * 1.18, wid * 0.08, 0, wid * 0.22);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(20, 0, 5, 0.38)';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      if (warmShift > 0.01) {
        ctx.fillStyle = `rgba(255, 215, 224, ${warmShift * 0.12})`;
        ctx.fill();
      }

      ctx.restore();
    }

    function drawRose(x, y, radius, tilt, time, highlight) {
      if (radius < 1) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      const glow = ctx.createRadialGradient(0, 0, radius * 0.15, 0, 0, radius * 1.4);
      glow.addColorStop(0, 'rgba(225, 29, 72, 0.24)');
      glow.addColorStop(1, 'rgba(225, 29, 72, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.4, 0, Math.PI * 2);
      ctx.fill();

      const rings = [
        { count: 7, t: 0.96, spread: 0.28 },
        { count: 6, t: 0.66, spread: 0.18 },
        { count: 5, t: 0.38, spread: 0.09 }
      ];

      rings.forEach((ring, rIdx) => {
        for (let i = 0; i < ring.count; i++) {
          const ang = (i / ring.count) * Math.PI * 2 + rIdx * 0.52 + Math.sin(time * 1.4 + i) * 0.035;
          const px = Math.cos(ang) * radius * ring.spread;
          const py = Math.sin(ang) * radius * ring.spread;
          drawPetal(px, py, radius * (1 - rIdx * 0.14), ang + Math.PI / 2, ring.t, highlight);
        }
      });

      const centerGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, radius * 0.26);
      centerGrad.addColorStop(0, '#ff8fa3');
      centerGrad.addColorStop(0.65, '#9f1239');
      centerGrad.addColorStop(1, '#36000c');
      ctx.fillStyle = centerGrad;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.23, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawWrap(cx, cy, spread, time) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.sin(time * 1.1) * 0.015);

      const w = Math.min(spread * 0.88, 158);
      const topY = -28;
      const botY = Math.min(height * 0.21, 155);

      // سيقان
      ctx.strokeStyle = '#153b2a';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * w * 0.2, topY + 15);
        ctx.lineTo(i * 2.5, botY - 10);
        ctx.stroke();
      }

      // خلفية التغليف الداكنة
      ctx.beginPath();
      ctx.moveTo(-w * 0.92, topY + 12);
      ctx.lineTo(0, botY + 10);
      ctx.lineTo(w * 0.92, topY + 12);
      ctx.quadraticCurveTo(0, topY + 38, -w * 0.92, topY + 12);
      ctx.fillStyle = '#21040c';
      ctx.fill();

      // جناحا التغليف الأمامي بلمعة ذهبية
      const gLeft = ctx.createLinearGradient(-w, topY + 20, 0, botY);
      gLeft.addColorStop(0, '#fff7f9');
      gLeft.addColorStop(1, '#e4aebd');

      ctx.beginPath();
      ctx.moveTo(-w * 0.85, topY + 26);
      ctx.lineTo(0, botY + 12);
      ctx.lineTo(-w * 0.06, topY + 78);
      ctx.quadraticCurveTo(-w * 0.48, topY + 62, -w * 0.85, topY + 26);
      ctx.closePath();
      ctx.fillStyle = gLeft;
      ctx.fill();
      ctx.strokeStyle = 'rgba(245, 203, 127, 0.8)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const gRight = ctx.createLinearGradient(w, topY + 20, 0, botY);
      gRight.addColorStop(0, '#fff1f4');
      gRight.addColorStop(1, '#da9eae');

      ctx.beginPath();
      ctx.moveTo(w * 0.85, topY + 26);
      ctx.lineTo(0, botY + 12);
      ctx.lineTo(w * 0.06, topY + 78);
      ctx.quadraticCurveTo(w * 0.48, topY + 62, w * 0.85, topY + 26);
      ctx.closePath();
      ctx.fillStyle = gRight;
      ctx.fill();
      ctx.stroke();

      // شريطة ساتان حمراء
      const ry = topY + (botY - topY) * 0.6;
      ctx.fillStyle = '#be123c';
      ctx.beginPath();
      ctx.moveTo(-30, ry - 4);
      ctx.quadraticCurveTo(0, ry + 5, 30, ry - 4);
      ctx.lineTo(26, ry + 8);
      ctx.quadraticCurveTo(0, ry + 16, -26, ry + 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.ellipse(-11, ry + 2, 11, 6.5, -0.2, 0, Math.PI * 2);
      ctx.ellipse(11, ry + 2, 11, 6.5, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#881337';
      ctx.beginPath();
      ctx.arc(0, ry + 2, 4.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawParticle(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.alpha);

      if (p.isGold) {
        ctx.fillStyle = '#f5cb7f';
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const g = ctx.createRadialGradient(-1, -2, 1, 0, 0, p.size);
        g.addColorStop(0, '#ff8fa3');
        g.addColorStop(0.65, '#c9002b');
        g.addColorStop(1, '#4c0010');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, p.size * 0.55);
        ctx.bezierCurveTo(-p.size * 0.9, p.size * 0.25, -p.size * 0.75, -p.size * 0.8, 0, -p.size * 0.95);
        ctx.bezierCurveTo(p.size * 0.75, -p.size * 0.8, p.size * 0.9, p.size * 0.25, 0, p.size * 0.55);
        ctx.fill();
      }

      ctx.restore();
    }

    let lastNow = performance.now();
    let ambientAcc = 0;

    function render(now) {
      const dt = Math.min((now - lastNow) / 1000, 0.05);
      lastNow = now;
      const t = now / 1000;

      tiltX += (targetTiltX - tiltX) * Math.min(1, dt * 6);
      tiltY += (targetTiltY - tiltY) * Math.min(1, dt * 6);

      if (opened) {
        openAnim = Math.min(1, openAnim + dt * 1.15);
      }

      ambientAcc += dt;
      if (ambientAcc > 0.55 && particles.length < 70) {
        ambientAcc = 0;
        spawnAmbientPetal();
      }

      ctx.clearRect(0, 0, width, height);

      // إضاءة مركزية تتحرك قليلاً مع الإمالة
      const lightX = width * 0.5 + tiltX * 26;
      const lightY = height * 0.34 + tiltY * 20;
      const bgGrad = ctx.createRadialGradient(lightX, lightY, 12, lightX, lightY, Math.max(width, height) * 0.58);
      bgGrad.addColorStop(0, 'rgba(225, 29, 72, 0.25)');
      bgGrad.addColorStop(0.55, 'rgba(136, 19, 55, 0.08)');
      bgGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      const baseX = width * 0.5;
      const baseY = height * 0.34;
      const scaleFactor = Math.max(0.72, Math.min(1.12, Math.min(width, height) / 390));
      const easedOpen = 1 - Math.pow(1 - openAnim, 3);

      // رسم الوردات حسب العمق (من الأبعد للأقرب)
      const sortedRoses = [...roses].sort((a, b) => a.depth - b.depth);
      sortedRoses.forEach((rose, idx) => {
        const pX = tiltX * (rose.depth - 0.8) * 34;
        const pY = tiltY * (rose.depth - 0.8) * 24;
        const rx = baseX + rose.ox * Math.min(width, 420) * (0.7 + 0.3 * easedOpen) + pX;
        const ry = baseY + rose.oy * height + pY;
        const breathe = 1 + Math.sin(t * 2 + idx) * 0.03;
        drawRose(rx, ry, rose.r * scaleFactor * easedOpen * breathe, rose.rot + tiltX * 0.06, t, easedOpen * 0.4);
      });

      // رسم التغليف
      if (easedOpen > 0.02) {
        ctx.save();
        ctx.globalAlpha = easedOpen;
        drawWrap(
          baseX + tiltX * 10,
          baseY + 30 * scaleFactor + tiltY * 8,
          Math.min(width * 0.42, 165),
          t
        );
        ctx.restore();
      }

      // تحديث ورسم الجسيمات والبتلات
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life++;
        p.x += p.vx + Math.sin(t * 2.2 + i) * 0.35;
        p.y += p.vy;
        p.vy += p.isGold ? 0.015 : 0.04;
        p.vx *= 0.985;
        p.rot += p.vRot;

        const fadePoint = p.maxLife * 0.65;
        if (p.life > fadePoint) {
          p.alpha *= 0.94;
        }

        drawParticle(p);

        if (p.life >= p.maxLife || p.y > height + 40 || p.alpha < 0.02) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
